# Render blueprint for the Hybrid RAG API.
#
# The critical settings here are all about memory. The process baseline is
# roughly 310 MB (two fp32 ONNX sessions ~200 MB, plus Python, FastAPI, faiss,
# ONNX Runtime and the indexes), so on a 512 MB instance there is only about
# 200 MB of headroom and the two things that reliably exhaust it are:
#
#   1. More than one worker. Each uvicorn worker is a full copy of the model
#      sessions, so `--workers 2` alone doubles the baseline to ~620 MB and the
#      instance is killed immediately. This MUST stay at 1.
#   2. Unbounded concurrency. Every in-flight request holds transformer
#      activations, so the limits below cap how many can exist at once.
#
# IMPORTANT: for a service that was NOT created from this blueprint, Render uses
# the Build Command and Start Command stored in the dashboard and ignores the
# values below. Editing this file alone will not change that service. Copy both
# commands into Settings -> Build & Deploy by hand.
#
# In particular, a Build Command of
#     pip install -r requirements.txt && python scripts/ingest.py
# fails: requirements.txt is serving-only, so ingestion cannot import pdfplumber.
# It must be just
#     pip install -r requirements.txt

services:
  - type: web
    name: hybrid-rag
    runtime: python
    plan: starter
    # Serving dependencies ONLY. requirements.txt deliberately omits pdfplumber,
    # PyMuPDF, pandas and scikit-learn, so the build must NOT run
    # scripts/ingest.py - ingestion needs those packages and would fail here with
    # ModuleNotFoundError. It does not need to run anyway: the FAISS and BM25
    # indexes are committed to the repo and read directly at startup. Rebuild
    # them locally with `pip install -r requirements-offline.txt` followed by
    # `python scripts/ingest.py`, then commit the updated data/ artifacts.
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # --workers 1        one copy of the ~200 MB of model weights, never two
    # --limit-concurrency rejects excess load with 503 instead of running out of
    #                     memory, so a traffic spike degrades instead of dying
    # --timeout-keep-alive  drop idle connections rather than holding buffers
    #
    # Deliberately NOT used: --limit-max-requests. With a single worker there is
    # no sibling process to take over, so uvicorn terminating the process to
    # recycle it is a hard restart with downtime - indistinguishable in the logs
    # from the OOM restarts this configuration exists to prevent. Resident memory
    # is flat across requests, so there is nothing to recycle for.
    startCommand: >-
      uvicorn backend.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --limit-concurrency 12
      --timeout-keep-alive 5
    healthCheckPath: /health
    envVars:
      # glibc allocates a separate arena per thread and never returns them, so
      # RSS otherwise grows with thread count instead of with real usage. This
      # must be an environment variable to take effect at process start;
      # backend.runtime also applies it via mallopt as a belt-and-braces measure.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Pin the native math libraries to one thread each. Extra threads buy no
      # speed on a fractional-CPU instance and each one costs scratch memory.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      # Cap the thread pool that runs the sync endpoints. Starlette's default is
      # 40, which would allow 40 concurrent inferences and their activations.
      - key: MAX_REQUEST_THREADS
        value: "2"
      # Keep the Hugging Face cache on the instance disk rather than re-fetching
      # the ~86 MB ONNX graphs into a temp dir on every cold start.
      - key: HF_HOME
        value: /opt/render/project/.cache/huggingface
      # Never write .pyc files for modules imported once at startup.
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
